<h1>Results</h1>
<hr>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="inlineRadioOptionsAll" id="inlineRadioAll" value="All" checked>
  <label class="form-check-label" for="inlineRadioAll">All</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadioD1" value="D1">
  <label class="form-check-label" for="inlineRadioD1">D1</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadioD2" value="D2">
  <label class="form-check-label" for="inlineRadioD2">D2</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadioD3" value="D3">
  <label class="form-check-label" for="inlineRadioD3">D3</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadioD4" value="D4">
  <label class="form-check-label" for="inlineRadioD4">D4</label>
</div>
<hr>
<table class="table table-striped">
    <thead>
        <tr>
            <th scope="col">Division</th>
            <th scope="col">Home Team</th>
            <th scope="col">Score</th>
            <th scope="col">Score</th>
            <th scope="col">Away Team</th>
        </tr>
    </thead>
    <tbody>
        @for(result of results; track result.id){
        <tr>
            <td>{{ result.division}}</td>
            <td><span class="dot" [style.backgroundColor]="'rgb(' + result.hteam.rgb + ')'"></span>{{ result.hteam }}</td>
            <td>{{ result.hteamscore }}({{result.hteamtotal}})</td>
            <td>{{ result.ateamscore}}({{result.ateamtotal}})</td>
            <td><span class="dot" [style.backgroundColor]="'rgb(' + result.ateam.rgb + ')'"></span>{{ result.ateam }}</td>
        </tr>
        }
    </tbody>
</table>
