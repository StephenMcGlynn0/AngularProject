<h1>Score For/Against</h1>
<hr>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Team</th>
      <th>For</th>
      <th>Against</th>
    </tr>
  </thead>
  <tbody>
    @for(team of teamStats; track team.name) {
    <tr>
      <td><span class="dot" [style.backgroundColor]="'rgb(' + team.rgb + ')'"></span> {{ team.name }}</td>
      <td>{{ team.for }}</td>
      <td>{{ team.against }}</td>
    </tr>
    }
  </tbody>
</table>
<hr>
<div id="chart"></div>
